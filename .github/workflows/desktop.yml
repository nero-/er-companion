name: Desktop builds
run-name: Desktop builds (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            artifact: linux-x86_64
            args: "--bundles deb,rpm,appimage"
          - name: Windows x86_64
            platform: windows-latest
            artifact: windows-x86_64
            args: "--bundles nsis"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Rust tests
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: er-companion-${{ matrix.artifact }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # Attach every platform's installer to the release that matches the pushed tag.
  # Without this job the matrix builds Windows and macOS installers and then lets
  # them expire as workflow artifacts, which is why a locally assembled release
  # only ever contained Linux packages.
  publish:
    name: Publish release assets
    needs: build
    # Run whenever the tag is pushed and at least one platform built, even if a
    # sibling job was cancelled; `always()` would also run on total failure.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result != 'failure' && needs.build.result != 'skipped'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download every platform bundle
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          # Linux: deb, rpm, AppImage.
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          # Windows: NSIS setup executable.
          find dist -type f -name '*setup.exe' -exec cp {} release/ \;
          cd release
          ls -la
          if [ -z "$(ls -A)" ]; then
            echo "error: no installers were collected" >&2
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if the tag was pushed without one, then upload.
          # --clobber makes this safe to re-run after a partial upload.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          for asset in release/*; do
            gh release upload "$TAG" "$asset" --clobber
          done
          gh release view "$TAG" --json url,assets \
            --jq '{url, assets: [.assets[] | "\(.name) \(.size)"]}'
