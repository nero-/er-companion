[package]
name = "er-companion"
version = "1.0.0"
description = "Offline Elden Ring route, collection, build and lore companion"
authors = ["ER Companion contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "er_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
